services:
  - type: web
    name: meeting-vote
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-vote-db
          property: connectionString
    disk:
      mountPath: /opt/render/project/src/data

databases:
  - name: meeting-vote-db
    engine: postgresql
    plan: starter
    version: "14"
    diskSizeGb: 1
