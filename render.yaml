services:
  - type: web
    name: meeting-vote
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        value: change-this-password
      - key: SESSION_SECRET
        value: change-this-secret-key
      - key: DATABASE_URL
        value: ${databases.meeting-vote-db.connectionString}
      - key: DATA_DIR
        value: /tmp/meeting-vote-data

databases:
  - name: meeting-vote-db
    engine: postgresql
    plan: free
    version: "16"
