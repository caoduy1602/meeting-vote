services:
  - type: web
    name: meeting-vote
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: ADMIN_PASSWORD
        value: change-this-password
      - key: SESSION_SECRET
        value: change-this-secret-key
    disk:
      name: data-disk
      mountPath: /opt/render/project/src/data
      sizeGb: 0.5
